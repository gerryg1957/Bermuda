[package]
name = "bermuda-qt"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"


[dependencies]
bermuda = { path = ".." }
cxx = "1.0.194"
cxx-qt = "0.8.1"
cxx-qt-lib = { version = "0.8.1", features = ["qt_full"] }
cxx-qt-lib-extras = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = { version = "0.8.1", features = ["link_qt_object_files"] }
